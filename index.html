<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Vasu!</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="confetti"></canvas>
  <div class="balloons" id="balloons"></div>

  <main class="card">
    <h1 class="title">🎉 Happy Birthday, <span>Vasu!</span> 🎉</h1>
    <p class="typed" id="typed"></p>

    <div class="cake" id="cake" title="Click the candle flames to blow them out!">
      <div class="candles">
        <div class="candle"><div class="flame"></div></div>
        <div class="candle"><div class="flame"></div></div>
        <div class="candle"><div class="flame"></div></div>
      </div>
      <div class="layer top"></div>
      <div class="layer middle"></div>
      <div class="layer bottom"></div>
      <div class="plate"></div>
    </div>
    <p class="hint" id="hint">Click the cake to blow out the candles 🎂</p>

    <button id="surprise">🎁 Click for a surprise!</button>
    <p class="wish" id="wish"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
